[package]
name = "qd"
version = "0.1.0"
edition = "2024"

[dependencies]
age = "0.12.1"
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.6", features = ["derive", "env"] }
dirs = "6.0.0"
globset = "0.4.20"
jiff = "0.2.35"
mlua = { version = "0.12.1", features = ["lua55", "vendored", "serialize", "error-send"] }
self-replace = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.5"
ureq = { version = "3.4.0", features = ["json"] }
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "s"
